[project]
name = "pyschval"
version = "1.1.1"
description = "A python based wrapper around saxon and schxslt"
authors = [{ name = "Bastian Politycki", email = "bastian.politycki@unisg.ch" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["saxonche >=12.4.0", "parsel >= 1.8.1"]

[dependency-groups]
dev = [
    "ruff >= 0.1.11",
    "pyright >= 1.1.292",
    "pytest >= 7.2.1",
    "saxonche-stubs >= 0.6.0",
]

[build-system]
build-backend = 'hatchling.build'
requires = ['hatchling']

[tool.pyright]
include = ["*.py"]
exclude = ["**/__pycache__"]
reportMissingImports = true

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I001"]
ignore = ["E501"]
